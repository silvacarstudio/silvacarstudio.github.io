<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Silva Studio</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="wrap head"><a class="brand" href="#inicio"><img src="images/logo.png"></a><nav id="nav"></nav><a id="headBtn" class="btn outline">Agendar turno</a><button id="menu">☰</button></div><div id="mobile"></div></header>
<main>
<section id="inicio" class="hero"><div class="hero-bg"></div><div class="overlay"></div><div class="wrap hero-content"><p id="heroEy" class="eyebrow"></p><h1 id="heroTitle"></h1><p id="heroSub"></p><a id="heroBtn" class="btn primary"></a></div></section>
<section id="servicios" class="section wrap"><p id="srvEy" class="eyebrow"></p><h2 id="srvTitle"></h2><p id="srvSub" class="muted"></p><div id="services" class="grid"></div></section>
<section id="nosotros" class="about">
  <div class="aboutMedia">
    <img src="images/about.jpg" referrerpolicy="no-referrer" alt="Silva Studio">
  </div>
  <div class="aboutText">
    <p id="aboutEy" class="eyebrow"></p>
    <h2 id="aboutTitle"></h2>
    <div id="aboutCopy"></div>
  </div>
</section>
<section id="galeria" class="section wrap"><p id="galEy" class="eyebrow"></p><h2 id="galTitle"></h2><div id="gallery" class="gallery"></div></section>
<section class="cta"><div class="wrap ctaIn"><div><p id="ctaEy" class="eyebrow"></p><h2 id="ctaTitle"></h2></div><a id="ctaBtn" class="btn primary"></a></div></section>
<section id="contacto" class="section wrap contact"><div><p id="conEy" class="eyebrow"></p><h2 id="conTitle"></h2></div><div id="contactInfo"></div></section>
</main><footer><div class="wrap foot"><img src="images/logo.png"><span id="foot"></span></div></footer>
<div id="lightbox"><button id="close">×</button><img id="lightImg"></div><script src="config.js"></script><script src="script.js"></script></body></html>
